name: Deploy Backend to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script_stop: true
        script: |
          mkdir -p ~/app
          cd ~/app

          if [ ! -d ".git" ]; then
            git clone https://github.com/chetanschetan/Pinnacle-backend.git .
          else
            git pull origin main
          fi

          # Force stop and force remove existing container
          docker rm -f pinnacle-backend-container || true

          # Build and run fresh container
          docker build -t pinnacle-backend .
          docker run -d \
            --name pinnacle-backend-container \
            -p 5000:5000 \
            --restart always \
            pinnacle-backend